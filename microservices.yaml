# ==========================================
# 1. МИКРОСЕРВИС АВТОМОБИЛЕЙ (CARS)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: car-service
  template:
    metadata:
      labels:
        app: car-service
    spec:
      containers:
      - name: car-service
        image: dmitrybalandin278/car-rental-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: car-service-svc
spec:
  selector:
    app: car-service
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP

