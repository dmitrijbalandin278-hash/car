# ==========================================
# 5. ШЛЮЗ NGINX (Входная точка)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location /cars/ {
            proxy_pass http://car-service-svc:5000/;
            proxy_set_header Host $host;
        }

        location /clients/ {
            proxy_pass http://client-service-svc:5000/;
            proxy_set_header Host $host;
        }

        location /rentals/ {
            proxy_pass http://rental-service-svc:5000/;
            proxy_set_header Host $host;
        }

        location /maintenance/ {
            proxy_pass http://maintenance-service-svc:5000/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://car-service-svc:5000/;
            proxy_set_header Host $host;
        }
    }